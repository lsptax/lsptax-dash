# fly.toml app configuration file generated for lsptax-dash on 2026-05-23T09:19:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lsptax-dash'
primary_region = 'dfw'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
